<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="panMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9aa0a8" />
      <stop offset="16%" stop-color="#6a6f78" />
      <stop offset="42%" stop-color="#3e4248" />
      <stop offset="68%" stop-color="#2a2d32" />
      <stop offset="100%" stop-color="#16181b" />
    </linearGradient>
    <linearGradient id="panMetalEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d5d8de" />
      <stop offset="18%" stop-color="#8b9098" />
      <stop offset="82%" stop-color="#2c2f34" />
      <stop offset="100%" stop-color="#0c0d0f" />
    </linearGradient>
    <linearGradient id="panGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d48a" />
      <stop offset="45%" stop-color="#c9a24e" />
      <stop offset="100%" stop-color="#8a6824" />
    </linearGradient>
    <linearGradient id="panSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28" />
    </linearGradient>
    <pattern id="panCarbon" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#101010" />
      <rect width="3" height="3" fill="#1a1a1a" />
      <rect x="3" y="3" width="3" height="3" fill="#1a1a1a" />
      <rect x="3" y="0" width="3" height="3" fill="#141414" />
      <rect x="0" y="3" width="3" height="3" fill="#141414" />
    </pattern>
    <pattern id="panGrain" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="transparent" />
      <path d="M0 1h8" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.6" />
      <path d="M0 3h8" stroke="#000000" stroke-opacity="0.08" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect x="6" y="10" width="888" height="264" rx="48" fill="#000000" opacity="0.4" />
  <rect x="2" y="2" width="896" height="276" rx="50" fill="url(#panMetalEdge)" />
  <rect x="6" y="6" width="888" height="268" rx="46" fill="url(#panMetal)" />
  <rect x="6" y="6" width="888" height="268" rx="46" fill="url(#panGrain)" />

  <rect x="30" y="30" width="840" height="220" rx="34" fill="#0b0b0b" />
  <rect x="34" y="34" width="832" height="212" rx="30" fill="none" stroke="url(#panGold)" stroke-width="2.4" />
  <rect x="40" y="40" width="820" height="200" rx="26" fill="url(#panCarbon)" />
  <rect x="40" y="40" width="820" height="200" rx="26" fill="url(#panSheen)" />
</svg>
